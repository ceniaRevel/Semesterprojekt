<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Aktivitäten rund um Zürich</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body>
    <header>
        <h1>Aktivitäten rund um Zürich</h1>
        <div class="filter">
            <select id="kategorie" class="dropdown">
                <option value="">Kategorie</option>
                <option value="Attractions">Attraktionen</option>
                <option value="Climbing">Klettern</option>
                <option value="Hikes">Wanderungen</option>
                <option value="Motor Boat Hire">Motorbootverleih</option>
                <option value="Mountain Biking">Mountainbiken</option>
                <option value="Nature">Natur</option>
                <option value="SkiingSnowboarding">Schneesport</option>
                <option value="Sport">Sport</option>
                <option value="SUP Stand Up Paddling">Stand-up-Paddling</option>
                <option value="Vantage Points">Aussichtspunkte</option>
                <option value="Walks">Spaziergänge</option>
                <option value="Water">Wasser</option>
                <option value="WaterskiingWakeboarding">Wasserski</option>
                <option value="Wellness">Wellness</option>
            </select>
            <select id="preisbereich" class="dropdown">
                <option value="">Preisbereich</option>
                <option value="gratis">Kostenlos</option>
                <option value="0-10">Bis 10</option>
                <option value="11-35">CHF 11 bis 35</option>
                <option value="36-50">CHF 36 bis 50</option>
                <option value="51-100">CHF 51 bis 100</option>
            </select>
            <div class="pins">
                <button type="button" class="indoor-outdoor" data-place="Indoors">
                <img src="img/pin.png" alt="Pin" class="pin">
                <span>Indoors</span>
            </button>

            <button type="button" class="indoor-outdoor" data-place="Outdoors">
                <img src="img/pin.png" alt="Pin" class="pin">
                <span>Outdoors</span>
            </button>
            </div>
        </div>     
    </header>
    <main>
    <div class="map-section">
        <div id="map"></div>

        <aside id="map-popup" class="map-popup is-hidden">
            <button id="map-popup-close" class="map-popup-close" aria-label="Popup schließen">×</button>
            <img id="map-popup-image" src="" alt="" class="map-popup-image">
            <h3 id="map-popup-title" class="map-popup-title"></h3>
            <button id="map-popup-button" class="map-popup-button">Erfahre mehr</button>
        </aside>
    </div>

    <section id="details" class="details-section">
        <div id="details-card">
            <div class="details-image-wrap">
                <img id="details-image" src="" alt="" class="details-image">
            </div>

            <div class="details-content">
                <h2 id="details-title"></h2>
                <p id="details-teaser" class="details-teaser"></p>

                <div class="details-meta">
                    <p id="details-category"></p>
                    <p id="details-address"></p>
                    <p id="details-price"></p>
                    <p id="details-phone"></p>
                    <p id="details-url" class="details-url"></p>
                </div>
            </div>

            <div class="details-description">
                <p id="details-description"></p>
            </div>
        </div>
    </section>
    </main>   
    <footer>
        <p>Interaktive Medien II - Cenia Revel und Chiara Schweizer</p>
    </footer>
    <script src="js/script.js" type="module"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin="">
    </script>
</body>
</html>
